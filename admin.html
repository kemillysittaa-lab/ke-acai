<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel | Ke Açaí</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f3f7;
    color: #2b1835;
}

header {
    background: linear-gradient(135deg, #3b0a57, #741b8c);
    color: white;
    padding: 24px 18px;
}

header h1 {
    font-size: 26px;
}

header p {
    margin-top: 5px;
    opacity: .85;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.card span {
    display: block;
    font-size: 14px;
    color: #777;
    margin-bottom: 8px;
}

.card strong {
    font-size: 24px;
    color: #54106e;
}

h2 {
    margin: 25px 0 15px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.botao {
    background: white;
    border: none;
    border-radius: 15px;
    padding: 22px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    color: #43105b;
    text-align: left;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
}

.botao:hover {
    transform: translateY(-2px);
}

.pedido {
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.pedido-topo {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.status {
    background: #fff0c2;
    color: #7c5900;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.vazio {
    color: #777;
}

.novo-pedido {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #651181;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.2);
}

@media(max-width: 750px) {
    .resumo {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍇 Painel Ke Açaí</h1>
    <p>Controle da sua loja</p>
</header>

    <div id="loginAdmin" class="container">
    <div class="card">
        <h2>🔐 Acesso administrativo</h2>

        <input type="email" id="emailAdmin" placeholder="Seu e-mail">

        <input type="password" id="senhaAdmin" placeholder="Sua senha">

        <button class="botao" onclick="entrarAdmin()">
            Entrar
        </button>

        <p id="erroLogin"></p>
    </div>
</div>

<div class="container" id="painelAdmin" style="display: none;">

    <h2>Resumo de hoje</h2>

    <div class="resumo">

        <div class="card">
            <span>Pedidos</span>
            <strong id="totalPedidos">0</strong>
        </div>

        <div class="card">
            <span>Vendas</span>
            <strong id="totalVendas">R$ 0,00</strong>
        </div>

        <div class="card">
            <span>Custos</span>
            <strong id="totalCustos">R$ 0,00</strong>
        </div>

        <div class="card">
            <span>Lucro estimado</span>
            <strong id="lucro">R$ 0,00</strong>
        </div>

    </div>

    <h2>Gerenciar</h2>

    <div class="menu">

        <button class="botao">
            📦 Pedidos e comandas
        </button>

        <button class="botao">
            🍧 Produtos e preços
        </button>

        <button class="botao">
            💰 Financeiro
        </button>

        <button class="botao">
            📊 Relatórios
        </button>

       <button class="botao" onclick="abrirPromocoes()">
           🎁 Promoções
        </button>

        <button class="botao">
            ⚙️ Configurações
        </button>

    </div>

    <h2>Pedidos recentes</h2>

    <div id="listaPedidos">

        <div class="pedido">
            <p class="vazio">
                Nenhum pedido registrado ainda.
            </p>
        </div>

    </div>

</div>

    <div id="areaPromocoes" class="container" style="display: none;">

    <h2>🎁 Cupons e promoções</h2>

    <div class="card">
        <h2>Novo cupom</h2>

        <input type="text" id="cupomCodigo" placeholder="Código: BEMVINDO10">

        <select id="cupomTipo">
            <option value="percentual">Desconto em %</option>
            <option value="fixo">Desconto em R$</option>
        </select>

        <input type="number" id="cupomValor" placeholder="Valor do desconto">

        <input type="number" id="cupomMinimo" placeholder="Pedido mínimo">

        <input type="datetime-local" id="cupomValidade">

        <input type="number" id="cupomLimite" placeholder="Limite de usos">

        <button class="botao" onclick="salvarCupom()">
            + Criar cupom
        </button>
    </div>

    <h2>Cupons cadastrados</h2>

    <div id="listaCupons">
        <p class="vazio">Nenhum cupom cadastrado.</p>
    </div>

</div>

<button class="novo-pedido" onclick="novoPedido()">
    + Novo pedido
</button>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://ncukfroazgjnwvrmzxyu.supabase.co";

    const SUPABASE_KEY = "sb_publishable_T9oyWTb31mxJybxM09Z81A_AoXqfdig";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

   async function entrarAdmin() {
       
    const email = document.getElementById("emailAdmin").value;
    const senha = document.getElementById("senhaAdmin").value;
    const erro = document.getElementById("erroLogin");

    erro.textContent = "";

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
    });

    if (error) {
        erro.textContent = "E-mail ou senha incorretos.";
        return;
    }

    document.getElementById("loginAdmin").style.display = "none";
    document.getElementById("painelAdmin").style.display = "block";
    alert("Login realizado com sucesso! 💜");
}
    function abrirPromocoes() {
    document.getElementById("painelAdmin").style.display = "none";
    document.getElementById("areaPromocoes").style.display = "block";
    carregarCupons();
}

    async function salvarCupom() {
    const codigo = document.getElementById("cupomCodigo").value.trim().toUpperCase();
    const tipo = document.getElementById("cupomTipo").value;
    const valor = Number(document.getElementById("cupomValor").value);
    const pedidoMinimo = Number(document.getElementById("cupomMinimo").value || 0);
    const validade = document.getElementById("cupomValidade").value;
    const limiteUsos = document.getElementById("cupomLimite").value;

    if (!codigo || !valor || valor <= 0) {
        alert("Preencha o código e o valor do desconto.");
        return;
    }

    const { error } = await supabaseClient
        .from("Cupons")
        .insert({
            codigo: codigo,
            tipo: tipo,
            valor: valor,
            ativo: true,
            pedido_minimo: pedidoMinimo,
            validade: validade || null,
            limite_usos: limiteUsos ? Number(limiteUsos) : null,
            usos: 0
        });

    if (error) {
        console.error(error);
        alert("Não foi possível criar o cupom.");
        return;
    }

    alert("Cupom criado com sucesso! 🎁");
    carregarCupons();
}

    async function carregarCupons() {
    const lista = document.getElementById("listaCupons");

    const { data, error } = await supabaseClient
        .from("Cupons")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        lista.innerHTML = '<p class="vazio">Não foi possível carregar os cupons.</p>';
        return;
    }

    if (!data || data.length === 0) {
        lista.innerHTML = '<p class="vazio">Nenhum cupom cadastrado.</p>';
        return;
    }

    lista.innerHTML = "";

    data.forEach(cupom => {
        const desconto = cupom.tipo === "percentual"
            ? `${cupom.valor}%`
            : dinheiro(Number(cupom.valor));

        lista.innerHTML += `
            <div class="pedido">
                <div class="pedido-topo">
                    <strong>${cupom.codigo}</strong>
                    <span class="status">
                        ${cupom.ativo ? "Ativo" : "Inativo"}
                    </span>
                </div>

                <p><strong>Desconto:</strong> ${desconto}</p>
                <p><strong>Pedido mínimo:</strong> ${dinheiro(Number(cupom.pedido_minimo || 0))}</p>
                <p><strong>Usos:</strong> ${cupom.usos || 0}${cupom.limite_usos ? ` / ${cupom.limite_usos}` : ""}</p>
            </div>
        `;
    });
}

    
let pedidos = [];

function dinheiro(valor) {
    return valor.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}

function novoPedido() {

    const cliente = prompt("Nome do cliente:");

    if (!cliente) {
        return;
    }

    const valorTexto = prompt(
        "Qual o valor total do pedido?"
    );

    const custoTexto = prompt(
        "Qual foi o custo aproximado desse pedido?"
    );

    const valor = Number(
        String(valorTexto).replace(",", ".")
    );

    const custo = Number(
        String(custoTexto).replace(",", ".")
    );

    if (isNaN(valor) || isNaN(custo)) {
        alert("Digite valores válidos.");
        return;
    }

    const pedido = {
        numero: pedidos.length + 1,
        cliente: cliente,
        valor: valor,
        custo: custo,
        status: "Novo"
    };

    pedidos.push(pedido);

    atualizarPainel();
}

function atualizarPainel() {

    const quantidade = pedidos.length;

    const vendas = pedidos.reduce(
        (total, pedido) => total + pedido.valor,
        0
    );

    const custos = pedidos.reduce(
        (total, pedido) => total + pedido.custo,
        0
    );

    const lucro = vendas - custos;

    document.getElementById("totalPedidos").textContent =
        quantidade;

    document.getElementById("totalVendas").textContent =
        dinheiro(vendas);

    document.getElementById("totalCustos").textContent =
        dinheiro(custos);

    document.getElementById("lucro").textContent =
        dinheiro(lucro);

    mostrarPedidos();
}

function mostrarPedidos() {

    const lista = document.getElementById("listaPedidos");

    if (pedidos.length === 0) {
        lista.innerHTML =
            '<div class="pedido"><p class="vazio">Nenhum pedido registrado ainda.</p></div>';

        return;
    }

    lista.innerHTML = "";

    [...pedidos].reverse().forEach(pedido => {

        lista.innerHTML += `
        <div class="pedido">

            <div class="pedido-topo">

                <strong>
                    Pedido #${String(pedido.numero).padStart(4,"0")}
                </strong>

                <span class="status">
                    ${pedido.status}
                </span>

            </div>

            <p>
                <strong>Cliente:</strong>
                ${pedido.cliente}
            </p>

            <p>
                <strong>Total:</strong>
                ${dinheiro(pedido.valor)}
            </p>

            <p>
                <strong>Lucro estimado:</strong>
                ${dinheiro(pedido.valor - pedido.custo)}
            </p>

        </div>
        `;
    });
}

</script>

</body>
</html>
